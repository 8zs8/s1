<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穆旦《我看》—— 诗配乐 · 背景画卷</title>
<link rel="preload" as="image" href="bg1.webp">
<link rel="preload" as="image" href="bg2.webp">
<link rel="preload" as="image" href="bg3.webp">
<link rel="preload" as="image" href="bg4.webp">
<link rel="preload" as="image" href="bg5.webp">
<link rel="preload" as="image" href="bg6.webp">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, "Microsoft YaHei", sans-serif; }

  /* ===== 启动加载页 ===== */
  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease, visibility 1s;
  }
  #loadingScreen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .loading-bg {
    position: absolute;
    inset: 0;
    background: url('bg1_thumb.webp') center/cover;
    filter: blur(20px) brightness(0.5);
    transform: scale(1.1);
  }
  .loading-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #fff;
  }
  .loading-content h1 {
    font-size: 36px;
    font-weight: 300;
    letter-spacing: 12px;
    margin-bottom: 10px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.6);
  }
  .loading-subtitle {
    font-size: 14px;
    opacity: 0.7;
    letter-spacing: 4px;
    margin-bottom: 40px;
  }
  .loading-bar-container {
    width: 280px;
    height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    margin: 0 auto 16px;
    overflow: hidden;
  }
  .loading-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(255,255,255,0.5), #fff);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .loading-text {
    font-size: 13px;
    opacity: 0.6;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }
  .loading-status {
    font-size: 11px;
    opacity: 0.35;
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* ===== 主内容 ===== */
  #mainContent {
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #mainContent.visible { opacity: 1; }

  /* 背景图层 —— 两张叠加做交叉淡入淡出 */
  .bg-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-size: cover;
    background-position: center;
    transition: opacity 1.2s ease-in-out;
    z-index: 1;
  }
  .bg-layer.hidden { opacity: 0; }
  .bg-layer.visible { opacity: 1; }

  /* 暗角遮罩 */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.05) 40%, rgba(0,0,0,0.45) 100%);
    z-index: 2;
    pointer-events: none;
  }

  /* 标题区 */
  .title-area {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 3;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .title-area h1 {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 8px;
    margin-bottom: 8px;
  }
  .title-area .subtitle {
    font-size: 14px;
    opacity: 0.75;
    letter-spacing: 3px;
  }

  /* 当前段落提示 */
  .section-label {
    position: fixed;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #fff;
    font-size: 15px;
    letter-spacing: 4px;
    opacity: 0.8;
    text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    transition: opacity 0.6s;
  }

  /* 播放器控制区 */
  .player-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 20px 40px 28px;
    z-index: 3;
    background: linear-gradient(to top, rgba(0,0,0,0.5), transparent);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 760px;
    margin: 0 auto;
  }
  .play-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.25s;
  }
  .play-btn:hover {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.9);
  }
  .play-btn svg { width: 16px; height: 16px; fill: #fff; }
  .play-btn .icon-pause { display: none; }
  .play-btn.playing .icon-play { display: none; }
  .play-btn.playing .icon-pause { display: block; }

  .time-text {
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    min-width: 36px;
    text-align: center;
  }

  .progress-container {
    flex: 1;
    height: 20px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .progress-track {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: rgba(255,255,255,0.85);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }
  .progress-thumb {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    left: 0%;
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
  }
  .progress-container:hover .progress-thumb,
  .progress-container.dragging .progress-thumb { opacity: 1; }

  .volume-control {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .volume-icon {
    width: 18px;
    height: 18px;
    fill: rgba(255,255,255,0.7);
    cursor: pointer;
    flex-shrink: 0;
  }
  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 70px;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .volume-slider::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    border: none;
    cursor: pointer;
  }

  .timeline-markers {
    max-width: 760px;
    margin: 10px auto 0;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    padding: 0 54px;
  }
  .timeline-markers span {
    cursor: pointer;
    transition: color 0.3s;
  }
  .timeline-markers span:hover { color: rgba(255,255,255,0.9); }
  .timeline-markers span.active { color: #ffd700; }
</style>
</head>
<body>

<!-- ===== 启动加载页 ===== -->
<div id="loadingScreen">
  <div class="loading-bg"></div>
  <div class="loading-content">
    <h1>我 看</h1>
    <div class="loading-subtitle">穆旦 · 诗配乐背景画卷</div>
    <div class="loading-bar-container">
      <div class="loading-bar" id="loadingBar"></div>
    </div>
    <div class="loading-text" id="loadingText">0%</div>
    <div class="loading-status" id="loadingStatus">正在加载资源…</div>
  </div>
</div>

<!-- ===== 主内容 ===== -->
<div id="mainContent">
  <div id="bgA" class="bg-layer visible"></div>
  <div id="bgB" class="bg-layer hidden"></div>
  <div class="overlay"></div>

  <div class="title-area">
    <h1>我 看</h1>
    <div class="subtitle">穆旦 · 诗朗诵背景音乐画卷</div>
  </div>

  <div id="sectionLabel" class="section-label">傍晚静景</div>

  <div class="player-bar">
    <audio id="audio" preload="auto">
      <source src="poem_bg_music_full.wav" type="audio/wav">
    </audio>
    <div class="controls">
      <button id="playBtn" class="play-btn" title="播放/暂停">
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <span id="currentTime" class="time-text">0:00</span>
      <div class="progress-container" id="progressContainer">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
      <span id="duration" class="time-text">2:40</span>
      <div class="volume-control">
        <svg id="volumeIcon" class="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
    <div class="timeline-markers" id="markers">
      <span data-time="0" class="active">傍晚静景</span>
      <span data-time="30">天地悠远</span>
      <span data-time="57">感怀生命</span>
      <span data-time="83">怀古沉静</span>
      <span data-time="113">生命奔放</span>
      <span data-time="148">复归平和</span>
    </div>
  </div>
</div>

<script>
  // ===== 场景配置：高清图 + 低清占位图 =====
  const scenes = [
    { time: 0,   img: 'bg1.webp', thumb: 'bg1_thumb.webp', label: '傍晚静景' },
    { time: 30,  img: 'bg2.webp', thumb: 'bg2_thumb.webp', label: '天地悠远' },
    { time: 57,  img: 'bg3.webp', thumb: 'bg3_thumb.webp', label: '感怀生命' },
    { time: 83,  img: 'bg4.webp', thumb: 'bg4_thumb.webp', label: '怀古沉静' },
    { time: 113, img: 'bg5.webp', thumb: 'bg5_thumb.webp', label: '生命奔放' },
    { time: 148, img: 'bg6.webp', thumb: 'bg6_thumb.webp', label: '复归平和' },
  ];

  const bgA = document.getElementById('bgA');
  const bgB = document.getElementById('bgB');
  const audio = document.getElementById('audio');
  const sectionLabel = document.getElementById('sectionLabel');
  const markers = document.getElementById('markers');
  const loadingScreen = document.getElementById('loadingScreen');
  const mainContent = document.getElementById('mainContent');
  const loadingBar = document.getElementById('loadingBar');
  const loadingText = document.getElementById('loadingText');
  const loadingStatus = document.getElementById('loadingStatus');

  let currentScene = -1;
  let useA = true;

  // ===== 启动预加载 =====
  // 策略：只等第一张图 + 音频可播放就进入播放器，其余图片后台继续加载
  let loadedCount = 0;
  const TOTAL_ITEMS = scenes.length * 2 + 1;

  function updateProgress(status) {
    loadedCount++;
    const pct = Math.min(99, Math.round((loadedCount / TOTAL_ITEMS) * 100));
    loadingBar.style.width = pct + '%';
    loadingText.textContent = pct + '%';
    if (status) loadingStatus.textContent = status;
  }

  function preloadImage(src, status) {
    return new Promise((resolve) => {
      const img = new Image();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        updateProgress(status);
        resolve();
      };
      img.onload = finish;
      img.onerror = () => finish();
      img.src = src;
      // 缓存命中时 complete 已为 true，直接放行
      if (img.complete) finish();
      // 8 秒超时兜底，防止网络慢导致卡死
      setTimeout(finish, 8000);
    });
  }

  function preloadAudio() {
    return new Promise((resolve) => {
      loadingStatus.textContent = '正在加载音频…';
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        updateProgress('音频就绪');
        resolve();
      };
      audio.addEventListener('canplay', finish, { once: true });
      audio.addEventListener('loadeddata', finish, { once: true });
      audio.load();
      // 3 秒超时兜底
      setTimeout(finish, 3000);
    });
  }

  async function preloadAll() {
    // 后台并行预加载所有图片（不阻塞启动）
    scenes.forEach((s, i) => {
      preloadImage(s.thumb, '低清图 ' + (i+1) + '/6');
      preloadImage(s.img, '高清图 ' + (i+1) + '/6');
    });
    // 只等第一张高清图 + 音频，即可进入播放器
    const firstImg = preloadImage(scenes[0].img, '首图加载完成');
    const audioReady = preloadAudio();
    await Promise.all([firstImg, audioReady]);
    startPlayer();
    // 全局兜底：8 秒后无论如何都进入（防止极端情况卡死）
    setTimeout(startPlayer, 8000);
  }

  let playerStarted = false;
  function startPlayer() {
    if (playerStarted) return;
    playerStarted = true;
    loadingStatus.textContent = '加载完成';
    // 初始化第一张背景图
    bgA.style.backgroundImage = "url('" + scenes[0].img + "')";
    // 淡入主内容，淡出加载页
    mainContent.classList.add('visible');
    setTimeout(() => {
      loadingScreen.classList.add('hidden');
    }, 600);
    // 初始化场景
    switchScene(0);
  }

  // 启动预加载
  preloadAll();

  // ===== 场景切换 =====
  async function switchScene(index) {
    if (index === currentScene) return;
    const scene = scenes[index];
    currentScene = index;

    // 先铺低清占位图（瞬时显示），再交叉淡入高清图
    const targetLayer = useA ? bgB : bgA;
    const currentLayer = useA ? bgA : bgB;

    // 低清图先设为底层背景（带模糊）
    targetLayer.style.backgroundImage = "url('" + scene.thumb + "')";
    targetLayer.style.filter = 'blur(8px) brightness(0.9)';
    targetLayer.classList.remove('hidden');
    targetLayer.classList.add('visible');

    // 高清图加载确认后替换（预加载阶段已全部加载，此处为保险）
    const hiImg = new Image();
    hiImg.onload = () => {
      targetLayer.style.backgroundImage = "url('" + scene.img + "')";
      targetLayer.style.filter = 'none';
      // 旧层淡出
      currentLayer.classList.remove('visible');
      currentLayer.classList.add('hidden');
      useA = !useA;
    };
    hiImg.src = scene.img;
    // 如果已缓存，onload 可能同步触发；加个兜底
    if (hiImg.complete) hiImg.onload();

    // 更新段落标签
    sectionLabel.style.opacity = '0';
    setTimeout(() => {
      sectionLabel.textContent = scene.label;
      sectionLabel.style.opacity = '0.8';
    }, 400);

    // 更新时间节点标记
    document.querySelectorAll('#markers span').forEach((el, i) => {
      el.classList.toggle('active', i === index);
    });
  }

  function getSceneIndex(time) {
    for (let i = scenes.length - 1; i >= 0; i--) {
      if (time >= scenes[i].time) return i;
    }
    return 0;
  }

  // 监听播放时间
  audio.addEventListener('timeupdate', () => {
    const idx = getSceneIndex(audio.currentTime);
    if (idx !== currentScene) switchScene(idx);
  });
  audio.addEventListener('seeked', () => {
    const idx = getSceneIndex(audio.currentTime);
    if (idx !== currentScene) switchScene(idx);
  });

  // 时间节点点击跳转
  markers.addEventListener('click', (e) => {
    if (e.target.tagName === 'SPAN') {
      const t = parseFloat(e.target.dataset.time);
      audio.currentTime = t;
      audio.play();
    }
  });

  // ===== 自定义播放器控件 =====
  const playBtn = document.getElementById('playBtn');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const progressContainer = document.getElementById('progressContainer');
  const progressFill = document.getElementById('progressFill');
  const progressThumb = document.getElementById('progressThumb');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');

  function formatTime(sec) {
    if (isNaN(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) audio.play();
    else audio.pause();
  });
  audio.addEventListener('play', () => playBtn.classList.add('playing'));
  audio.addEventListener('pause', () => playBtn.classList.remove('playing'));

  audio.addEventListener('loadedmetadata', () => {
    durationEl.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    const pct = (audio.currentTime / audio.duration) * 100 || 0;
    progressFill.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
  });

  // 进度条拖动
  let isDragging = false;
  function seekFromEvent(e) {
    const rect = progressContainer.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = (clientX - rect.left) / rect.width;
    pct = Math.max(0, Math.min(1, pct));
    audio.currentTime = pct * audio.duration;
  }
  progressContainer.addEventListener('mousedown', (e) => {
    isDragging = true;
    progressContainer.classList.add('dragging');
    seekFromEvent(e);
  });
  document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
  document.addEventListener('mouseup', () => {
    if (isDragging) { isDragging = false; progressContainer.classList.remove('dragging'); }
  });
  progressContainer.addEventListener('touchstart', (e) => {
    isDragging = true;
    progressContainer.classList.add('dragging');
    seekFromEvent(e);
  }, { passive: true });
  document.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
  document.addEventListener('touchend', () => {
    if (isDragging) { isDragging = false; progressContainer.classList.remove('dragging'); }
  });

  // 音量
  volumeSlider.addEventListener('input', () => {
    audio.volume = parseFloat(volumeSlider.value);
    updateVolumeIcon();
  });
  volumeIcon.addEventListener('click', () => {
    audio.muted = !audio.muted;
    updateVolumeIcon();
  });
  function updateVolumeIcon() {
    const v = audio.muted ? 0 : audio.volume;
    if (v === 0) {
      volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    } else if (v < 0.5) {
      volumeIcon.innerHTML = '<path d="M7 9v6h4l5 5V4l-5 5H7z"/>';
    } else {
      volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    }
  }
</script>
</body>
</html>
